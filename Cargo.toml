[workspace]
members = ["crates/vtm-core", "crates/vtm-cli"]
resolver = "2"

[workspace.package]
version = "0.0.25"
edition = "2024"
license = "MIT"
authors = ["Yuki Yano"]
repository = "https://github.com/yuki-yano/vde-tmux-manager"

[workspace.dependencies]
anyhow = "1.0.100"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
serde_yaml = "0.9.34"
thiserror = "2.0.17"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"
